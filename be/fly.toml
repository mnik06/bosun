app = "bosun-be"
primary_region = "lhr"

[build]

[env]
  NODE_ENV = "production"
  HOST = "0.0.0.0"
  PORT = "8080"
  # Which agent build machines are told to run is discovered, not configured:
  # `releases/latest` redirects to the newest tag and the version is read out of
  # it, so releasing an agent is the whole procedure. Rolling a bad release back
  # is adding AGENT_EXPECTED_VERSION here — the pin wins over discovery.
  AGENT_LATEST_RELEASE_URL = "https://github.com/mnik06/bosun/releases/latest"
  # {version} is what makes "this exact build" expressible. A base ending in
  # `releases/latest/download` fetches whatever latest has become, which is a
  # rollback that quietly reinstalls the release it was rolling back from.
  AGENT_DOWNLOAD_BASE_URL = "https://github.com/mnik06/bosun/releases/download/agent-v{version}"

# auto_stop is off on purpose: this process holds long-lived agent WebSockets,
# and a proxy-stopped machine drops every one of them.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "15s"
    method = "GET"
    path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
